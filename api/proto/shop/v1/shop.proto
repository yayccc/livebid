syntax = "proto3";

package livebid.shop.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/yayccc/livebid/gen/proto/shop/v1;shopv1";

service ShopService {
  rpc RegisterShop(RegisterShopRequest) returns (RegisterShopResponse);
  rpc LoginShop(LoginShopRequest) returns (LoginShopResponse);
  rpc GetShop(GetShopRequest) returns (GetShopResponse);
  rpc BatchGetPublicShops(BatchGetPublicShopsRequest) returns (BatchGetPublicShopsResponse);
  rpc UpdateShop(UpdateShopRequest) returns (UpdateShopResponse);
}

message RegisterShopRequest {
  string username = 1;
  string password = 2;
  string shop_name = 3;
  string logo = 4;
  string description = 5;
  string phone = 6;
  string email = 7;
}

message RegisterShopResponse {
  Shop shop = 1;
}

message LoginShopRequest {
  string username = 1;
  string password = 2;
  string login_ip = 3;
  string user_agent = 4;
}

message LoginShopResponse {
  Shop shop = 1;
  string token = 2;
}

message GetShopRequest {
  int64 id = 1;
}

message GetShopResponse {
  Shop shop = 1;
}

message BatchGetPublicShopsRequest {
  repeated int64 ids = 1;
}

message BatchGetPublicShopsResponse {
  repeated Shop list = 1;
}

message UpdateShopRequest {
  int64 id = 1;
  optional string shop_name = 2;
  optional string logo = 3;
  optional string description = 4;
  optional string phone = 5;
  optional string email = 6;
}

message UpdateShopResponse {
  Shop shop = 1;
}

message Shop {
  int64 id = 1;
  string username = 2;
  string shop_name = 3;
  string logo = 4;
  string description = 5;
  string phone = 6;
  string email = 7;
  int32 status = 8;
  int32 audit_status = 9;
  string audit_reason = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}
