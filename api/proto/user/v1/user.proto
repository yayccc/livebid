syntax = "proto3";

package livebid.user.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/yayccc/livebid/gen/proto/user/v1;userv1";

service UserService {
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
  rpc LoginUser(LoginUserRequest) returns (LoginUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateCurrentUser(UpdateCurrentUserRequest) returns (UpdateCurrentUserResponse);
  rpc CreateAddress(CreateAddressRequest) returns (CreateAddressResponse);
  rpc ListAddresses(ListAddressesRequest) returns (ListAddressesResponse);
  rpc GetAddress(GetAddressRequest) returns (GetAddressResponse);
  rpc UpdateAddress(UpdateAddressRequest) returns (UpdateAddressResponse);
  rpc DeleteAddress(DeleteAddressRequest) returns (DeleteAddressResponse);
  rpc SetDefaultAddress(SetDefaultAddressRequest) returns (SetDefaultAddressResponse);
}

message RegisterUserRequest {
  string username = 1;
  string password = 2;
  string nickname = 3;
  string avatar = 4;
  string phone = 5;
  string email = 6;
}

message RegisterUserResponse {
  User user = 1;
}

message LoginUserRequest {
  string username = 1;
  string password = 2;
}

message LoginUserResponse {
  User user = 1;
  string access_token = 2;
  int64 expires_in = 3;
}

message GetUserRequest {
  int64 id = 1;
}

message GetUserResponse {
  User user = 1;
}

message UpdateCurrentUserRequest {
  optional string nickname = 1;
  optional string avatar = 2;
  optional int32 gender = 3;
  optional string birthday = 4;
  optional string phone = 5;
  optional string email = 6;
}

message UpdateCurrentUserResponse {
  User user = 1;
}

message CreateAddressRequest {
  string receiver_name = 1;
  string receiver_phone = 2;
  string province = 3;
  string city = 4;
  string district = 5;
  string detail_address = 6;
  string postal_code = 7;
  int32 is_default = 8;
}

message CreateAddressResponse {
  UserAddress address = 1;
}

message ListAddressesRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListAddressesResponse {
  int64 total = 1;
  int32 page = 2;
  int32 page_size = 3;
  repeated UserAddress list = 4;
}

message GetAddressRequest {
  int64 id = 1;
}

message GetAddressResponse {
  UserAddress address = 1;
}

message UpdateAddressRequest {
  int64 id = 1;
  optional string receiver_name = 2;
  optional string receiver_phone = 3;
  optional string province = 4;
  optional string city = 5;
  optional string district = 6;
  optional string detail_address = 7;
  optional string postal_code = 8;
  optional int32 is_default = 9;
}

message UpdateAddressResponse {
  UserAddress address = 1;
}

message DeleteAddressRequest {
  int64 id = 1;
}

message DeleteAddressResponse {}

message SetDefaultAddressRequest {
  int64 id = 1;
}

message SetDefaultAddressResponse {
  UserAddress address = 1;
}

message User {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
  string avatar = 4;
  int32 gender = 5;
  string birthday = 6;
  string phone = 7;
  string email = 8;
  int32 status = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message UserAddress {
  int64 id = 1;
  int64 user_id = 2;
  string receiver_name = 3;
  string receiver_phone = 4;
  string province = 5;
  string city = 6;
  string district = 7;
  string detail_address = 8;
  string postal_code = 9;
  int32 is_default = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}
