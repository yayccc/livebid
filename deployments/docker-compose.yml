name: livebid

x-go-service-build: &go-service-build
  context: ..
  dockerfile: Dockerfile

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: mydb
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  nacos:
    image: ${NACOS_IMAGE:-nacos/nacos-server:v3.0.3}
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-true}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-nacos}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-nacos}
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "${NACOS_CONSOLE_PORT:-8080}:8080"
      - "${NACOS_HTTP_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
      - "${NACOS_RAFT_PORT:-9849}:9849"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080 || curl -fsS http://127.0.0.1:8848/nacos"]
      interval: 10s
      timeout: 5s
      retries: 30

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    command: ["sh", "mqnamesrv"]
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    ports:
      - "9876:9876"
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    depends_on:
      rocketmq-perms:
        condition: service_completed_successfully

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "-c", "/home/rocketmq/broker.conf"]
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
      NAMESRV_ADDR: rocketmq-namesrv:9876
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - rocketmq-broker-store:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    depends_on:
      rocketmq-perms:
        condition: service_completed_successfully
      rocketmq-namesrv:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  rocketmq-init:
    image: apache/rocketmq:5.3.2
    command:
      - sh
      - -c
      - |
        sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c livebid-cluster -t auction_event
        sh mqadmin updateSubGroup -n rocketmq-namesrv:9876 -c livebid-cluster -g auction-service-consumer
        sh mqadmin updateSubGroup -n rocketmq-namesrv:9876 -c livebid-cluster -g ws-gateway-auction-broadcast -d true
    depends_on:
      rocketmq-broker:
        condition: service_healthy

  rocketmq-perms:
    image: alpine:3.20
    user: root
    volumes:
      - rocketmq-namesrv-logs:/rocketmq-namesrv-logs
      - rocketmq-broker-store:/rocketmq-broker-store
      - rocketmq-broker-logs:/rocketmq-broker-logs
    command: ["sh", "-c", "mkdir -p /rocketmq-namesrv-logs/rocketmqlogs /rocketmq-broker-logs/rocketmqlogs /rocketmq-broker-store && chown -R 3000:3000 /rocketmq-namesrv-logs /rocketmq-broker-store /rocketmq-broker-logs"]

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully

  rustfs-perms:
    image: alpine:3.20
    user: root
    volumes:
      - rustfs-data:/data
    command: ["sh", "-c", "chown -R 10001:10001 /data"]

  rustfs-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set rustfs http://rustfs:9000 rustfsadmin rustfsadmin; do
          sleep 2
        done
        mc mb --ignore-existing rustfs/livebid
        mc anonymous set download rustfs/livebid
    depends_on:
      rustfs:
        condition: service_started

  srs:
    image: ${SRS_IMAGE:-ossrs/srs:5}
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        candidate="$${SRS_RTC_CANDIDATE:-$${SRS_PUBLIC_HOST:-127.0.0.1}}"
        callback_base_url="$${SRS_CALLBACK_BASE_URL:-http://api-gateway:58080}"
        sed \
          -e "s|candidate       127.0.0.1;|candidate       $${candidate};|" \
          -e "s|http://api-gateway:58080|$${callback_base_url}|g" \
          conf/livebid.conf > /tmp/livebid.conf
        exec ./objs/srs -c /tmp/livebid.conf
    environment:
      SRS_PUBLIC_HOST: ${SRS_PUBLIC_HOST:-127.0.0.1}
      SRS_RTC_CANDIDATE: ${SRS_RTC_CANDIDATE:-}
      SRS_CALLBACK_BASE_URL: ${SRS_CALLBACK_BASE_URL:-http://api-gateway:58080}
    ports:
      - "${SRS_RTMP_PORT:-1935}:1935"
      - "${SRS_HTTP_API_PORT:-1985}:1985"
      - "${SRS_HTTP_SERVER_PORT:-8088}:8080"
      - "${SRS_RTC_PORT:-8000}:8000/udp"
    volumes:
      - ./srs/livebid.conf:/usr/local/srs/conf/livebid.conf:ro
    depends_on:
      api-gateway:
        condition: service_started

  shop-service:
    image: livebid-shop-service:latest
    restart: unless-stopped
    build:
      <<: *go-service-build
      args:
        SERVICE: shop-service
    environment:
      SHOP_SERVICE_ENV: local
      SHOP_SERVICE_GRPC_ADDR: ${GRPC_ADDR:-:9000}
      SHOP_SERVICE_MYSQL_DSN: ${MYSQL_DSN:-root:123456@tcp(mysql:3306)/mydb?charset=utf8mb4&parseTime=True&loc=Local}
      SHOP_SERVICE_MYSQL_AUTO_MIGRATE: "true"
      SHOP_SERVICE_NACOS_ENABLED: "true"
      SHOP_SERVICE_NACOS_SERVERS: nacos:8848
      SHOP_SERVICE_NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      SHOP_SERVICE_NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      SHOP_SERVICE_CONFIG_CENTER_ENABLED: "false"
      SHOP_SERVICE_REGISTRY_ENABLED: "true"
      SHOP_SERVICE_REGISTRY_PORT: "9000"
      SHOP_SERVICE_WORKER_ID: "1"
      SHOP_SERVICE_LOG_LEVEL: debug
      SHOP_SERVICE_LOG_ENCODING: console
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  user-service:
    image: livebid-user-service:latest
    restart: unless-stopped
    build:
      <<: *go-service-build
      args:
        SERVICE: user-service
    environment:
      USER_SERVICE_ENV: local
      USER_SERVICE_GRPC_ADDR: ${GRPC_ADDR:-:9000}
      USER_SERVICE_MYSQL_DSN: ${MYSQL_DSN:-root:123456@tcp(mysql:3306)/mydb?charset=utf8mb4&parseTime=True&loc=Local}
      USER_SERVICE_MYSQL_AUTO_MIGRATE: "true"
      USER_SERVICE_JWT_SECRET: ${LIVEBID_JWT_SECRET:-local-dev-jwt-secret-change-me}
      USER_SERVICE_JWT_ISSUER: ${LIVEBID_USER_JWT_ISSUER:-livebid-user}
      USER_SERVICE_NACOS_ENABLED: "true"
      USER_SERVICE_NACOS_SERVERS: nacos:8848
      USER_SERVICE_NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      USER_SERVICE_NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      USER_SERVICE_CONFIG_CENTER_ENABLED: "false"
      USER_SERVICE_REGISTRY_ENABLED: "true"
      USER_SERVICE_REGISTRY_PORT: "9000"
      USER_SERVICE_WORKER_ID: "4"
      USER_SERVICE_LOG_LEVEL: debug
      USER_SERVICE_LOG_ENCODING: console
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  goods-service:
    image: livebid-goods-service:latest
    restart: unless-stopped
    build:
      <<: *go-service-build
      args:
        SERVICE: goods-service
    environment:
      GOODS_SERVICE_ENV: local
      GOODS_SERVICE_GRPC_ADDR: ${GRPC_ADDR:-:9000}
      GOODS_SERVICE_MYSQL_DSN: ${MYSQL_DSN:-root:123456@tcp(mysql:3306)/mydb?charset=utf8mb4&parseTime=True&loc=Local}
      GOODS_SERVICE_MYSQL_AUTO_MIGRATE: "true"
      GOODS_SERVICE_NACOS_ENABLED: "true"
      GOODS_SERVICE_NACOS_SERVERS: nacos:8848
      GOODS_SERVICE_NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      GOODS_SERVICE_NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      GOODS_SERVICE_CONFIG_CENTER_ENABLED: "false"
      GOODS_SERVICE_REGISTRY_ENABLED: "true"
      GOODS_SERVICE_REGISTRY_PORT: "9000"
      GOODS_SERVICE_WORKER_ID: "2"
      GOODS_SERVICE_LOG_LEVEL: debug
      GOODS_SERVICE_LOG_ENCODING: console
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  live-service:
    image: livebid-live-service:latest
    restart: unless-stopped
    build:
      <<: *go-service-build
      args:
        SERVICE: live-service
    environment:
      LIVE_SERVICE_ENV: local
      LIVE_SERVICE_GRPC_ADDR: ${GRPC_ADDR:-:9000}
      LIVE_SERVICE_MYSQL_DSN: ${MYSQL_DSN:-root:123456@tcp(mysql:3306)/mydb?charset=utf8mb4&parseTime=True&loc=Local}
      LIVE_SERVICE_MYSQL_AUTO_MIGRATE: "true"
      LIVE_SERVICE_SRS_RTMP_PUSH_BASE_URL: rtmp://${SRS_PUBLIC_HOST:-127.0.0.1}:${SRS_RTMP_PORT:-1935}/live
      LIVE_SERVICE_SRS_WEBRTC_PLAY_BASE_URL: webrtc://${SRS_PUBLIC_HOST:-127.0.0.1}/live
      LIVE_SERVICE_NACOS_ENABLED: "true"
      LIVE_SERVICE_NACOS_SERVERS: nacos:8848
      LIVE_SERVICE_NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      LIVE_SERVICE_NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      LIVE_SERVICE_CONFIG_CENTER_ENABLED: "false"
      LIVE_SERVICE_REGISTRY_ENABLED: "true"
      LIVE_SERVICE_REGISTRY_PORT: "9000"
      LIVE_SERVICE_WORKER_ID: "7"
      LIVE_SERVICE_LOG_LEVEL: debug
      LIVE_SERVICE_LOG_ENCODING: console
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  auction-service:
    image: livebid-auction-service:latest
    restart: unless-stopped
    build:
      <<: *go-service-build
      args:
        SERVICE: auction-service
    environment:
      AUCTION_SERVICE_ENV: local
      AUCTION_SERVICE_GRPC_ADDR: ${GRPC_ADDR:-:9000}
      AUCTION_SERVICE_MYSQL_DSN: ${MYSQL_DSN:-root:123456@tcp(mysql:3306)/mydb?charset=utf8mb4&parseTime=True&loc=Local}
      AUCTION_SERVICE_MYSQL_AUTO_MIGRATE: "true"
      AUCTION_SERVICE_REDIS_ADDR: redis:6379
      AUCTION_SERVICE_REDIS_PASSWORD: ""
      AUCTION_SERVICE_REDIS_DB: "0"
      AUCTION_SERVICE_ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      AUCTION_SERVICE_ROCKETMQ_TOPIC: auction_event
      AUCTION_SERVICE_ROCKETMQ_PRODUCER_GROUP: auction-service-producer
      AUCTION_SERVICE_ROCKETMQ_CONSUMER_GROUP: auction-service-consumer
      AUCTION_SERVICE_ROCKETMQ_DELAY_LEVEL: "4"
      AUCTION_SERVICE_BID_COUNTDOWN_SECONDS: "30"
      AUCTION_SERVICE_EXPIRE_SCANNER_ENABLED: "true"
      AUCTION_SERVICE_EXPIRE_SCANNER_INTERVAL_SECONDS: "5"
      AUCTION_SERVICE_EXPIRE_SCANNER_BATCH_SIZE: "100"
      AUCTION_SERVICE_GOODS_TARGET: nacosx:///goods-service
      AUCTION_SERVICE_LIVE_TARGET: nacosx:///live-service
      AUCTION_SERVICE_NACOS_ENABLED: "true"
      AUCTION_SERVICE_NACOS_SERVERS: nacos:8848
      AUCTION_SERVICE_NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      AUCTION_SERVICE_NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      AUCTION_SERVICE_CONFIG_CENTER_ENABLED: "false"
      AUCTION_SERVICE_REGISTRY_ENABLED: "true"
      AUCTION_SERVICE_REGISTRY_PORT: "9000"
      AUCTION_SERVICE_WORKER_ID: "3"
      AUCTION_SERVICE_LOG_LEVEL: debug
      AUCTION_SERVICE_LOG_ENCODING: console
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
      rocketmq-init:
        condition: service_completed_successfully
      goods-service:
        condition: service_started
      live-service:
        condition: service_started

  api-gateway:
    image: livebid-api-gateway:latest
    restart: unless-stopped
    build:
      <<: *go-service-build
      args:
        SERVICE: api-gateway
    environment:
      API_GATEWAY_ENV: local
      API_GATEWAY_HTTP_ADDR: ":58080"
      API_GATEWAY_NACOS_ENABLED: "true"
      API_GATEWAY_NACOS_SERVERS: nacos:8848
      API_GATEWAY_NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      API_GATEWAY_NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      API_GATEWAY_CONFIG_CENTER_ENABLED: "false"
      API_GATEWAY_SHOP_SERVICE_TARGET: nacosx:///shop-service
      API_GATEWAY_USER_SERVICE_TARGET: nacosx:///user-service
      API_GATEWAY_GOODS_SERVICE_TARGET: nacosx:///goods-service
      API_GATEWAY_LIVE_SERVICE_TARGET: nacosx:///live-service
      API_GATEWAY_AUCTION_SERVICE_TARGET: nacosx:///auction-service
      API_GATEWAY_STORAGE_ENDPOINT: http://rustfs:9000
      API_GATEWAY_STORAGE_PUBLIC_BASE_URL: ${API_GATEWAY_STORAGE_PUBLIC_BASE_URL:-http://${PUBLIC_HOST:-127.0.0.1}:9000/livebid}
      API_GATEWAY_STORAGE_BUCKET: livebid
      API_GATEWAY_STORAGE_REGION: us-east-1
      API_GATEWAY_STORAGE_ACCESS_KEY_ID: rustfsadmin
      API_GATEWAY_STORAGE_SECRET_ACCESS_KEY: rustfsadmin
      API_GATEWAY_STORAGE_PATH_STYLE: "true"
      API_GATEWAY_JWT_SECRET: ${LIVEBID_JWT_SECRET:-local-dev-jwt-secret-change-me}
      API_GATEWAY_JWT_SHOP_ISSUER: ${LIVEBID_SHOP_JWT_ISSUER:-livebid-shop}
      API_GATEWAY_JWT_USER_ISSUER: ${LIVEBID_USER_JWT_ISSUER:-livebid-user}
      API_GATEWAY_RPC_TIMEOUT_SECONDS: "5"
      API_GATEWAY_LOG_LEVEL: debug
      API_GATEWAY_LOG_ENCODING: console
    ports:
      - "58080:58080"
    depends_on:
      nacos:
        condition: service_healthy
      rustfs:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully
      shop-service:
        condition: service_started
      user-service:
        condition: service_started
      goods-service:
        condition: service_started
      live-service:
        condition: service_started
      auction-service:
        condition: service_started

  ws-gateway:
    image: livebid-ws-gateway:latest
    restart: unless-stopped
    build:
      <<: *go-service-build
      args:
        SERVICE: ws-gateway
    environment:
      WS_GATEWAY_ENV: local
      WS_GATEWAY_WORKER_ID: "8"
      WS_GATEWAY_HTTP_ADDR: ":58081"
      WS_GATEWAY_REDIS_ADDR: redis:6379
      WS_GATEWAY_REDIS_PASSWORD: ""
      WS_GATEWAY_REDIS_DB: "0"
      WS_GATEWAY_ROCKETMQ_ENABLED: "true"
      WS_GATEWAY_ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      WS_GATEWAY_AUCTION_EVENT_TOPIC: auction_event
      WS_GATEWAY_AUCTION_CONSUMER_GROUP: ws-gateway-auction-broadcast
      WS_GATEWAY_AUCTION_SERVICE_TARGET: nacosx:///auction-service
      WS_GATEWAY_LIVE_SERVICE_TARGET: nacosx:///live-service
      WS_GATEWAY_USER_SERVICE_TARGET: nacosx:///user-service
      WS_GATEWAY_DANMAKU_ENABLED: "true"
      WS_GATEWAY_DANMAKU_MAX_CHARS: "30"
      WS_GATEWAY_DANMAKU_RECENT_LIMIT: "10"
      WS_GATEWAY_DANMAKU_RATE_LIMIT_SECONDS: "1"
      WS_GATEWAY_DANMAKU_RECENT_TTL_HOURS: "24"
      WS_GATEWAY_DANMAKU_REQUEST_TTL_SECONDS: "60"
      WS_GATEWAY_ROOM_STATUS_CACHE_TTL_SECONDS: "5"
      WS_GATEWAY_DANMAKU_NICKNAME_CACHE_TTL_MINUTES: "20"
      WS_GATEWAY_AI_INPUT_MODE: redis_pubsub
      WS_GATEWAY_INTERACTION_EVENT_TOPIC: live_interaction_event
      WS_GATEWAY_JWT_SECRET: ${LIVEBID_JWT_SECRET:-local-dev-jwt-secret-change-me}
      WS_GATEWAY_JWT_USER_ISSUER: ${LIVEBID_USER_JWT_ISSUER:-livebid-user}
      WS_GATEWAY_NACOS_ENABLED: "true"
      WS_GATEWAY_NACOS_SERVERS: nacos:8848
      WS_GATEWAY_NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      WS_GATEWAY_NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      WS_GATEWAY_CONFIG_CENTER_ENABLED: "false"
      WS_GATEWAY_LOG_LEVEL: debug
      WS_GATEWAY_LOG_ENCODING: console
    ports:
      - "58081:58081"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
      rocketmq-init:
        condition: service_completed_successfully
      live-service:
        condition: service_started
      auction-service:
        condition: service_started
      user-service:
        condition: service_started

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  nacos-logs:
  rocketmq-namesrv-logs:
  rocketmq-broker-store:
  rocketmq-broker-logs:
  rustfs-data:
