env: local
workerID: 1

grpc:
  addr: ":9001"

mysql:
  dsn: "root:123456@tcp(127.0.0.1:3306)/mydb?charset=utf8mb4&parseTime=True&loc=Local"
  autoMigrate: true
  maxOpenConns: 20
  maxIdleConns: 10
  connMaxLifetimeSeconds: 1800

log:
  level: debug
  encoding: console
  outputs:
    - stdout
  errorOutputs:
    - stderr
  development: true

nacos:
  enabled: true
  servers:
    - host: "127.0.0.1"
      port: 8848
  namespaceId: "livebid-local"

configCenter:
  enabled: false
  dataId: "livebid.local.shop-service.yaml"
  group: "LIVEBID"

registry:
  enabled: true
  provider: "nacos"
  serviceName: "shop-service"
  group: "LIVEBID"
  cluster: "default"
  ip: ""
  port: 0
  weight: 1

healthCheck:
  enabled: true
  intervalSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
